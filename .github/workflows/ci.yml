name: CI

on:
  # Layer 2 — the blocking gate set, run on every PR targeting master. The rules
  # come from this file and .github/workflows/gates.yml on master; the code
  # checked out is the PR head. A failed gate blocks the merge.
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The six blocking gates (D7), in blocking mode. Calls the reusable workflow
  # so the rule set has exactly one definition, owned by master.
  gates:
    uses: ./.github/workflows/gates.yml
    with:
      layer: blocking
      base_ref: master

  # Existing application jobs (kept): unit/integration-offline tests, a
  # clean-install smoke, and ruff. Gate 2/5 supersede parts of these but these
  # remain as the always-on baseline the project has relied on.
  test:
    name: tests (py${{ matrix.python-version }}${{ matrix.tz && format(', {0}', matrix.tz) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.12"
            tz: America/New_York
    env:
      TZ: ${{ matrix.tz }}
    defaults:
      run:
        working-directory: tradingagents
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -q

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tradingagents
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          python -c "import tradingagents, cli.main; print('clean-install import OK')"

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tradingagents
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.16"
      - name: Lint the sub-project
        run: ruff check .

  gate-selftests:
    name: gate self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest pyyaml
      - name: Verify the gate decision logic
        run: python -m pytest tests/gates -q
