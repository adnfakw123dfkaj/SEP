tradeoff_summary: |
  Must 项优先保证安全、可审计、速度和成本可测；Should 项提升输入校验、报告忠实度、
  记录完整性和时点完整性。Could 为空。Won't 项明确不做，避免范围蔓延。
  速度与质量、成本与覆盖、审计与存储之间存在显式取舍，均通过质量门禁和降级策略控制。

