schema_version: "1.0"

document:
  id: "SEP-REQ-TRADINGAGENTS-001"
  title: "TradingAgents 增强需求规格（最终实施版）"
  version: "1.0.1"
  date: "2026-11-16"
  status: "approved-for-planning"
  language: "zh-CN"
  scope: |
    基于 adnfakw123dfkaj/SEP 仓库中的 tradingagents 子项目，对 TradingAgents v0.7.1
    进行增强。本期按“完成项目优先”保留 14 条需求，分为 6 个高度解耦的 Part；
    不重写核心框架，不实现真实券商下单。
  source:
    repository: "https://github.com/adnfakw123dfkaj/SEP.git"
    subproject: "tradingagents"
    baseline: "TradingAgents v0.7.1"
    human_readable: "docs/req/requirements-final.md"
    implementation_plans: "docs/req/plans/"
  acceptance_rule: |
    每条需求必须同时具备可机器校验的 fit criterion 与可行实现方案；否则不进入
    requirements，列入 discarded。fit criterion 必须给出 metric、threshold 和 verification。

methodology:
  elicitation: "Osborne brainstorming：先发散、不批评，再按影响、可行性、可测试性、架构显著性和风险收敛。"
  convergence_criteria:
    - "直接改善 P1–P6 中的至少一个痛点"
    - "能在现有代码与课程周期内实现"
    - "能写出 metric + threshold + verification"
    - "有明确的架构或证据影响"
    - "风险可控，不引入不可验收的外部依赖"
  type_enum:
    - functional
    - invariant
    - quality
    - performance
    - cost
    - governance
    - security
  priority_enum:
    - must
    - should
    - could
    - wont
  priority_definitions:
    must: "本期必须完成；缺失则项目不能验收。"
    should: "重要；时间不足时按顺序裁剪，并记录原因。"
    could: "本期不做，或仅在 Must/Should 全部完成后考虑。"
    wont: "本期明确不做；见 out_of_scope/discarded。"
  part_enum:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6

measurement_definitions:
  p95: "30 次测量的第 95 百分位；15 次冷缓存 + 15 次热缓存，除非条目另有说明。"
  token_count: "provider 返回的输入 + 输出 token，包含重试；不包含本地工具解析。"
  rate: "0 到 1 之间的比例；threshold 使用小数表示。"
  run: "一次单 ticker、单 trade_date、单 profile 的执行。"
  machine_verification: "每个 fit criterion 的 verification 必须给出可执行命令或脚本；退出码为 0 且报告达到 threshold 才算通过。"

type_coverage:
  functional: 5
  invariant: 4
  quality: 2
  performance: 1
  cost: 1
  governance: 0
  security: 1

type_coverage_notes:
  governance:
    count: 0
    status: "intentionally_zero"
    reason: "本期按完成项目优先舍弃了人工复核、哈希链审计、告警、CI 审批闸门等 GOV-* 需求。"
    merged_into:
      - "REQ-FR-004"
      - "REQ-INV-001"
    recommended_action: "如果课程明确要求至少一条治理需求，恢复 REQ-GOV-001（运行 provenance 记录）并分配给 Part 3。"

assumptions:
  - "Python >= 3.11，沿用现有 pyproject.toml 依赖。"
  - "优先支持美股；港股/A 股不在本期验收范围。"
  - "参考环境为 4 vCPU / 16 GB RAM，到 provider 的网络延迟 <= 100 ms。"
  - "Yahoo、SEC、StockTwits 可访问；Reddit 可能返回 403，必须支持降级。"
  - "性能与成本测试使用 DeepSeek 或等价 OpenAI-compatible provider；provider 价格表可配置。"
  - "代码修改全部通过 OpenCode 会话完成，并保留会话记录作为 agentic software engineering 证据。"
  - "确定性测试使用固定 fixture 或录制数据；真实网络测试标记为 integration。"

