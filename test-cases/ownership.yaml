# Part ownership registry — manual claim.
#
# Each Part's tests live on master (tradingagents/tests/{req,security}). A Part is
# "unclaimed" until a developer claims it in their branch by setting
# `enabled: true` and filling `owner`, then commits the change with their PR.
#
# The claim rule (Gate G7 — see scripts/gates/check_ownership.py):
#   - unclaimed Part  -> its tests may skip (work not started): not counted.
#   - claimed Part    -> its tests must NOT skip and must pass (skip == failure).
#
# This makes "claim" a machine-enforced commitment, not a promise. Edit only the
# Part you own; do not change another Part's block.
#
# `tests` lists the test files whose outcomes count for the Part. Keep it in sync
# with test-cases/partN-*.md.

parts:
  part1:
    owner: null
    enabled: false
    tests:
      - tradingagents/tests/req/test_profiles.py
      - tradingagents/tests/req/test_preflight.py

  part2:
    owner: null
    enabled: false
    tests:
      - tradingagents/tests/req/test_debate_protocol.py
      - tradingagents/tests/req/test_debate_quality.py

